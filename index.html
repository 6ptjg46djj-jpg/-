<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>غدّي عقلك الكروي ⚽</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #111827, #1f2937);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-container {
            background: #111c24;
            border: 2px solid #10b981;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 480px;
            position: relative;
            min-height: 420px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 { color: #10b981; font-size: 26px; margin-top: 0; margin-bottom: 20px; }
        .subtitle { font-size: 14px; color: #9ca3af; margin-top: -15px; margin-bottom: 25px; }
        
        .screen { display: none; animation: fadeIn 0.3s ease-in-out forwards; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-btn {
            background: #1f2937;
            color: white;
            border: 2px solid #374151;
            padding: 14px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            font-weight: bold;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }
        .menu-btn:hover:not(:disabled) { background: #10b981; border-color: #10b981; transform: scale(1.02); }
        .menu-btn.start { background: #10b981; border-color: #10b981; }
        .menu-btn.start:hover { background: #059669; border-color: #059669; }
        
        .level-btn { position: relative; }
        .level-btn:disabled { background: #374151; border-color: #4b5563; color: #9ca3af; cursor: not-allowed; opacity: 0.6; }
        .level-btn:disabled::after { content: " 🔒"; }

        .stats-bar { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 15px; color: #fbbf24; font-weight: bold; background: #1f2937; padding: 8px 15px; border-radius: 8px; }
        .question { font-size: 18px; font-weight: bold; margin: 15px 0; background: #1f2937; padding: 18px; border-radius: 12px; border-right: 5px solid #10b981; line-height: 1.5; min-height: 54px; display: flex; align-items: center; justify-content: center; }
        .options-container { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 15px; }
        
        .option-btn {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            text-align: right;
            padding-right: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) { background: #4b5563; border-color: #10b981; }
        .option-btn:disabled { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; color: #9ca3af; }
        
        .help-container { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
        .help-btn { background: #d97706; color: white; border: none; padding: 8px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .help-btn:hover:not(:disabled) { background: #b45309; }
        .help-btn:disabled { background: #4b5563; opacity: 0.5; cursor: not-allowed; }

        .message { margin-top: 10px; font-size: 16px; min-height: 24px; font-weight: bold; }
        .error { color: #ef4444; }
        .success { color: #10b981; }
        
        .next-btn, .back-btn { background: #10b981; color: white; border: none; padding: 12px 25px; font-size: 15px; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 10px auto 0 auto; display: block; }
        .back-btn { background: #4b5563; width: 100%; box-sizing: border-box; }
        .back-btn:hover { background: #374151; }
        .next-btn:hover { background: #059669; }

        .sound-on { background: #10b981 !important; border-color: #10b981 !important; }
        .sound-off { background: #6b7280 !important; border-color: #6b7280 !important; }

        .info-text { font-size: 15px; line-height: 1.6; color: #d1d5db; text-align: center; background: #1f2937; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .final-msg { font-size: 18px; color: #10b981; font-weight: bold; line-height: 1.8; }
    </style>
</head>
<body>

<div class="game-container">

    <div id="main-menu" class="screen active">
        <h1>غدّي عقلك الكروي ⚽</h1>
        <div class="subtitle">تحدي المعلومات والطبقات الكروية الأقوى</div>
        <button class="menu-btn start" onclick="changeScreen('levels-menu')">ابدأ اللعبة 🎮</button>
        <button class="menu-btn" onclick="changeScreen('settings-screen')">الإعدادات ⚙️</button>
        <button class="menu-btn" onclick="changeScreen('dev-screen')">معلومات المطور 👨‍💻</button>
    </div>

    <div id="levels-menu" class="screen">
        <h1>اختر مستوى التحدي</h1>
        <button id="btn-easy" class="menu-btn level-btn" onclick="startLevel('easy')">المستوى السهل (15 سؤال)</button>
        <button id="btn-medium" class="menu-btn level-btn" onclick="startLevel('medium')" disabled>المستوى المتوسط (15 سؤال)</button>
        <button id="btn-hard" class="menu-btn level-btn" onclick="startLevel('hard')" disabled>المستوى الصعب (20 سؤال)</button>
        <button id="btn-impossible" class="menu-btn level-btn" onclick="startLevel('impossible')" disabled>المستوى المستحيل (25 سؤال)</button>
        <button class="menu-btn" style="background:#ef4444; border-color:#ef4444;" onclick="resetAllProgress()">إعادة تصفير جميع المستويات 🔄</button>
        <button class="back-btn" onclick="changeScreen('main-menu')">رجوع للقائمة الرئيسية 🏠</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="stats-bar">
            <div>المنطقة: <span id="current-level-name">-</span></div>
            <div>السؤال: <span id="q-progress">0/0</span></div>
            <div>العملات: <span id="coins-count">100</span> 🪙</div>
        </div>
        <div class="question" id="question">جاري التحميل...</div>
        
        <div class="help-container">
            <button id="help-50" class="help-btn" onclick="useHelpDropOne()">حذف خيار واحد (50 🪙)</button>
        </div>

        <div class="options-container" id="options"></div>
        <div class="message" id="message"></div>
        <button class="next-btn" id="next-button" style="display:none;" onclick="nextQuestion()">السؤال التالي ➡️</button>
        <button class="back-btn" style="margin-top:15px; padding:8px;" onclick="confirmExit()">انسحاب للقائمة الرئيسية 🏠</button>
    </div>

    <div id="settings-screen" class="screen">
        <h1>⚙️ الإعدادات</h1>
        <button id="sound-toggle" class="menu-btn sound-on" onclick="toggleSound()">الصوت: مفعل 🔊</button>
        <button class="menu-btn" onclick="rateGame()">تقييم اللعبة ⭐</button>
        <button class="back-btn" onclick="changeScreen('main-menu')">رجوع</button>
    </div>

    <div id="dev-screen" class="screen">
        <h1>👨‍💻 معلومات المطور</h1>
        <div class="info-text">
            <p style="font-size: 18px; color:#10b981; font-weight:bold;">هذه اللعبة مطورة من قبل الأسطورة<br>Youness Elkassimi</p>
            <p>جميع الحقوق محفوظة © 2026</p>
            <p style="color: #fbbf24;">إصدار اللعبة: v2.1.0</p>
        </div>
        <button class="back-btn" onclick="changeScreen('main-menu')">رجوع للقائمة الرئيسية 🏠</button>
    </div>

</div>

<script>
    let soundEnabled = true;
    function playSound(type) {
        if (!soundEnabled) return;
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'success') {
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            } else if (type === 'error') {
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.setValueAtTime(147, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
            }
        } catch(e) { console.log("الصوت غير مدعوم"); }
    }

            { question: "كم عدد الأهداف الرسمية التي سجلها الأسطورة بيليه في مسيرته بحسب توثيق الفيفا؟", options: ["1281 هدفاً", "767 هدفاً", "850 هدفاً", "650 هدفاً"], correct: 1 },
            { question: "ما هو الفريق الألماني الوحيد الذي لم يهبط أبداً من البوندسليغا حتى عام 2018؟", options: ["بايرن ميونخ", "هامبورغ", "بوروسيا دورتموند", "شالكه"], correct: 1 },
            { question: "من هو الحكم الإيطالي الأسطوري الأصلع الذي أدار نهائي كأس العالم 2002؟", options: ["بيرلويجي كولينا", "هاوارد ويب", "مارك كلاتنبرغ", "نيستور بيتانا"], correct: 0 },
            { question: "من هو اللاعب الذي سجل هدف الفوز لمنتخب إسبانيا في نهائي كأس العالم 2010؟", options: ["تشافي هيرنانديز", "أندريس إنييستا", "ديفيد فيا", "فرناندو توريس"], correct: 1 },
            { question: "أي نادٍ إيطالي يُلقب بـ الجراناتا؟", options: ["فيورنتينا", "تورينو", "سامبدوريا", "جنوى"], correct: 1 },
            { question: "ما هو المنتخب الوحيد الذي تأهل لجميع بطولات كأس العالم منذ تأسيسها؟", options: ["ألمانيا", "إيطاليا", "البرازيل", "الأرجنتين"], correct: 2 },
            { question: "في أي نادٍ إنجليزي أنهى النجم التونسي حاتم الطرابلسي مسيرته في البريميرليغ؟", options: ["أرسنال", "مانشستر سيتي", "توتنهام", "وست هام"], correct: 1 },
            { question: "من هو اللاعب الذي طُرد بنطحة شهيرة في نهائي كأس العالم 2006؟", options: ["زين الدين زيدان", "ماركو ماتيراتزي", "تييري هنري", "باتريك فييرا"], correct: 0 },
            { question: "من هو النجم الإفريقي الذي سجل هدف الكاميرون الشهير ضد الأرجنتين بمونديال 1990؟", options: ["روجيه ميلا", "فرانسوا أومام بييك", "توماس نكونو", "صامويل إيتو"], correct: 1 },
            { question: "أي نادٍ برتغالي عريق لَعِبَ له كريستيانو رونالدو في فئاته السنية وبداية مسيرته؟", options: ["بنفيكا", "bورتو", "سبورتينغ لشبونة", "براغا"], correct: 2 },
            { question: "من هو حارس المرمى الوحيد في تاريخ كرة القدم الذي نال جائزة الكرة الذهبية؟", options: ["جيانلويجي بوفون", "ليف ياشين", "إيكر كاسياس", "أوليفر كان"], correct: 1 },
            { question: "كم مرة فاز المنتخب المصري ببطولة كأس أمم إفريقيا متتالية؟", options: ["مرتين", "3 مرات", "4 مرات", "لا يوجد"], correct: 1 },
            { question: "أي لاعب يحمل الرقم القياسي لأسرع هدف في تاريخ بطولة كأس العالم؟", options: ["هاكان شوكور", "بيليه", "رونالدو", "كلوزه"], correct: 0 },
            { question: "ما هو النادي المكسيكي الأكثر جماهيرية وتتويجاً بدوري أبطال الكونكاكاف؟", options: ["كلوب أمريكا", "تغريس", "مونتيري", "غوادالاخارا"], correct: 0 },
            { question: "في أي عام ميلادي جمدت بطولات كأس العالم بسبب الحرب العالمية الثانية؟", options: ["1934 و 1938", "1942 و 1946", "1950 و 1954", "1938 و 1942"], correct: 1 },
            { question: "أي نادٍ إسباني يُعرف بلقب الغواصات الصفراء؟", options: ["قادش", "فياريال", "سلتا فيغو", "لاس بالماس"], correct: 1 },
            { question: "من هو الهداف التاريخي لمنتخب فرنسا لكرة القدم؟", options: ["تييري هنري", "أوليفيه جيرو", "كيليان مبابي", "ميشيل بلاتيني"], correct: 1 },
            { question: "كم عدد المقاعد المخصصة للمنتخبات في نهائيات كأس العالم انطلاقاً من مونديال 2026؟", options: ["32 منتخباً", "48 منتخباً", "40 منتخباً", "64 منتخباً"], correct: 1 },
            { question: "ما هو النادي الذي فاز بأول بطولة كأس عالم للأندية بشكلها القديم عام 2000؟", options: ["ريال مدريد", "كورينثيانز البرازيلي", "فاسكو دا غاما", "مانشستر يونايتد"], correct: 1 }
        ]
    };

    let currentLevel = 'easy';
    let currentQuestions = [];
    let currentQuestionIndex = 0;

    function saveProgressToStorage() {
        localStorage.setItem('football_quiz_unlocked_levels', JSON.stringify(unlockedLevels));
        localStorage.setItem('football_quiz_coins', coins);
    }

    function resetAllProgress() {
        if (confirm("هل تريد فعلاً مسح ذاكرة اللعبة والبدء مجدداً؟ سيتم إغلاق المستويات المفتوحة.")) {
            coins = 100;
            unlockedLevels = { easy: true, medium: false, hard: false, impossible: false };
            saveProgressToStorage();
            changeScreen('levels-menu');
            alert("تم تصفير التقدم بنجاح! 🔄");
        }
    }

    function changeScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(screenId === 'levels-menu') {
            document.getElementById('btn-medium').disabled = !unlockedLevels.medium;
            document.getElementById('btn-hard').disabled = !unlockedLevels.hard;
            document.getElementById('btn-impossible').disabled = !unlockedLevels.impossible;
        }
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        const btn = document.getElementById('sound-toggle');
        if (soundEnabled) {
            btn.innerText = "الصوت: مفعل 🔊";
            btn.className = "menu-btn sound-on";
        } else {
            btn.innerText = "الصوت: مكتوم 🔇";
            btn.className = "menu-btn sound-off";
        }
    }

    function rateGame() {
        alert("شكراً لك! سيتم توجيهك لتقييم اللعبة بـ 5 نجوم للأسطورة يونس 🌟");
    }

    function startLevel(level) {
        currentLevel = level;
        currentQuestions = [...allQuizData[level]].sort(() => Math.random() - 0.5);
        currentQuestionIndex = 0; // تبدأ الأسئلة دائماً من الصفر عند الدخول للمستوى
        
        let names = {easy: "السهل", medium: "المتوسط", hard: "الصعب", impossible: "المستحيل"};
        document.getElementById('current-level-name').innerText = names[level];
        document.getElementById('coins-count').innerText = coins;
        
        changeScreen('game-screen');
        showQuestion();
    }

    function showQuestion() {
        resetState();
        let q = currentQuestions[currentQuestionIndex];
        document.getElementById('q-progress').innerText = `${currentQuestionIndex + 1}/${currentQuestions.length}`;
        document.getElementById('question').innerText = q.question;

        updateHelpButtonState();

        q.options.forEach((option, index) => {
            const button = document.createElement('button');
            button.innerText = option;
            button.classList.add('option-btn');
            button.setAttribute('id', `opt-${index}`);
            button.addEventListener('click', () => selectAnswer(index));
            document.getElementById('options').appendChild(button);
        });
    }

    function resetState() {
        helpUsedCount = 0; 
        isCorrectAnswered = false;
        document.getElementById('message').innerText = '';
        document.getElementById('next-button').style.display = 'none';
        document.getElementById('options').innerHTML = '';
        document.getElementById('question').className = "question";
        document.getElementById('help-50').style.display = 'block';
    }

    function updateHelpButtonState() {
        const helpBtn = document.getElementById('help-50');
        if (coins < 50 || helpUsedCount >= 2) {
            helpBtn.disabled = true;
        } else {
            helpBtn.disabled = false;
        }
        helpBtn.innerText = `حذف خيار واحد (50 🪙) [مستعمل: ${helpUsedCount}/2]`;
    }

    function useHelpDropOne() {
        if (coins < 50 || helpUsedCount >= 2) return;
        
        let q = currentQuestions[currentQuestionIndex];
        let availableWrongIndices = [];
        
        for(let i = 0; i < 4; i++) {
            let btn = document.getElementById(`opt-${i}`);
            if(i !== q.correct && btn && !btn.disabled) {
                availableWrongIndices.push(i);
            }
        }
        
        if (availableWrongIndices.length > 0) {
            coins -= 50;
            helpUsedCount++;
            document.getElementById('coins-count').innerText = coins;
            saveProgressToStorage();
            
            availableWrongIndices.sort(() => Math.random() - 0.5);
            document.getElementById(`opt-${availableWrongIndices[0]}`).disabled = true;
            
            updateHelpButtonState();
        }
    }

    function selectAnswer(selectedIndex) {
        let q = currentQuestions[currentQuestionIndex];
        let msg = document.getElementById('message');
        let buttons = document.getElementById('options').children;

        for (let i = 0; i < buttons.length; i++) buttons[i].disabled = true;
        document.getElementById('help-50').disabled = true;

        if (selectedIndex === q.correct) {
            coins += 5; 
            document.getElementById('coins-count').innerText = coins;
            msg.className = "message success";
            msg.innerText = "إجابة صحيحة بالمليمتر! +5 عملات 🪙⚽";
            playSound('success');
            isCorrectAnswered = true;
            document.getElementById('next-button').innerText = "السؤال التالي ➡️";
            saveProgressToStorage();
        } else {
            msg.className = "message error";
            msg.innerText = `إجابة خاطئة! للأسف، يجب إعادة المستوى من السؤال الأول ❌`;
            playSound('error');
            isCorrectAnswered = false;
            document.getElementById('next-button').innerText = "إعادة المحاولة 🔄";
        }
        document.getElementById('next-button').style.display = 'block';
    }

    function nextQuestion() {
        if (isCorrectAnswered) {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                if (currentLevel === 'easy') { unlockedLevels.medium = true; alert("رائع! لقد أنهيت المستوى السهل بنجاح، وتم فتح المستوى المتوسط 🔓"); }
                else if (currentLevel === 'medium') { unlockedLevels.hard = true; alert("كفو! لقد أنهيت المستوى المتوسط بنجاح، وتم فتح المستوى الصعب 🔓"); }
                else if (currentLevel === 'hard') { unlockedLevels.impossible = true; alert("يا إلهي! لقد أنهيت المستوى الصعب بنجاح، وتم فتح المستوى المستحيل 🔓"); }
                else if (currentLevel === 'impossible') {
                    document.getElementById('question').className = "question final-msg";
                    document.getElementById('question').innerHTML = `لقد ختمت اللعبة يا أسطورة 🔥😮‍💨<br><br>شكراً للعبك لعبتنا و لا تنسى تقييمنا 🥹`;
                    document.getElementById('options').innerHTML = '';
                    document.getElementById('help-50').style.display = 'none';
                    document.getElementById('next-button').innerText = "العودة للقائمة الرئيسية 🏠";
                    document.getElementById('next-button').setAttribute('onclick', "window.location.reload()");
                    return;
                }
                saveProgressToStorage(); // حفظ فتح المستوى الجديد في ذاكرة المتصفح تلقائياً
                changeScreen('levels-menu');
            }
        } else {
            startLevel(currentLevel);
        }
    }

    function confirmExit() {
        if(confirm("هل أنت متأكد من الانسحاب والعودة للرئيسية؟ ستفقد تقدمك الحالي في هذا المستوى.")) {
            changeScreen('main-menu');
        }
    }
</script>
